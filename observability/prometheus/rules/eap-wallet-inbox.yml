groups:
  - name: eap-wallet-inbox
    rules:
      - alert: WalletInboxPermanentFailure
        expr: eap_wallet_inbox_messages{status="FAILED_PERMANENT"} > 0
        for: 1m
        labels:
          severity: critical
          service: eap-wallet
        annotations:
          summary: "Wallet inbox contains permanently failed messages"
          description: "{{ $value }} Wallet inbox message(s) require investigation before controlled recovery."

      - alert: WalletInboxOldestUnresolvedTooOld
        expr: eap_wallet_inbox_oldest_unresolved_age_seconds > 60
        for: 2m
        labels:
          severity: warning
          service: eap-wallet
        annotations:
          summary: "Wallet inbox is not converging"
          description: "The oldest unresolved Wallet inbox message is {{ $value | humanizeDuration }} old."
