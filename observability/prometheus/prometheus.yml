global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "eap-order"
    metrics_path: "/eap-order/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "eap-order"

  - job_name: "eap-wallet"
    metrics_path: "/eap-wallet/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: "eap-wallet"
